name: CI Qt6

on:
  push:
    branches:
      - master
      - 3.2
  pull_request:
    branches:
      - master
      - 3.2

jobs:
  # Each job builds all the build configurations one after the other, which saves installing Qt and
  # checking out the sources for each of them. A configuration is still built and tested when an
  # earlier one failed.
  build:
    name: ${{ matrix.os.name }}, Qt ${{ matrix.qt.name }}
    runs-on: ${{ matrix.os.runner }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: Linux
            runner: ubuntu-latest
            full_build: true
            # quickmaterialtest fails because of QT_QUICK_BACKEND=software and QT_QPA_PLATFORM=offscreen
            # quickinspectortest|quickinspectortest2 fail on CI, pass locally
            test_exclude: "quickmaterialtest|quickinspectortest|quickinspectortest2"

          - name: Windows
            runner: windows-latest
            full_build: true
            # quickmaterialtest: enable once QTBUG-144137 is fixed (affects 6.10)
            test_exclude: "quickmaterialtest|launchertest|probesettingstest"

          # GitHub actions is now powered by Apple Silicon Macs, where the full build fails
          - name: macOS
            runner: macos-latest
            full_build: false
            test_exclude: "probeabidetectortest|launchertest|clientconnectiontest|quickinspectortest2"
        qt:
          - name: "6.5"
            version: "6.5.*"
          - name: "6.10"
            version: "6.10.1" # bump to latest Qt freely
        exclude:
          - os:
              name: macOS
            qt:
              name: "6.5" # Qt 6.5 not supported on latest macos: ld: framework 'AGL' not found

    steps:
      - name: Install Qt with options and default aqtversion
        uses: jurplel/install-qt-action@v4
        with:
          aqtversion: null # use whatever the default is
          modules: qtshadertools qtscxml
          version: ${{ matrix.qt.version }}
          cache: true

      - name: Checkout sources
        uses: actions/checkout@v7

      - name: Checkout KDStateMachineEditor
        uses: ./.github/actions/checkout-kdsme

      - name: Install Dependencies on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt update -qq
          sudo apt install -y gdb doxygen

      - name: Install Dependencies on macOS
        if: ${{ runner.os == 'macOS' }}
        run: brew install bison

      - name: Install ninja-build tool (must be after Qt due PATH changes)
        uses: turtlesec-no/get-ninja@main

      - name: Add Bison to PATH (must be after Qt due PATH changes)
        if: ${{ runner.os == 'macOS' }}
        run: echo "/opt/homebrew/opt/bison/bin" >> $GITHUB_PATH

      - name: Make sure MSVC is found when Ninja generator is in use
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          toolset: ${{ startsWith(matrix.qt.version, '6.5') && '14.4' || '' }} # newer MSVC doesn't build Qt5 (qvector.h(960): error C2653: 'stdext': is not a class or namespace name)

      # Don't make graphviz find wrong libgd
      - name: Remove Strawberry from PATH
        if: ${{ runner.os == 'Windows' }}
        run: |
          Remove-Item "C:/Strawberry" -Recurse -Force

      - name: Set up the test environment on Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          # allow gdb to attach
          echo 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope
          echo "QT_QPA_PLATFORM=offscreen" >> $GITHUB_ENV
          echo "QT_QUICK_BACKEND=software" >> $GITHUB_ENV

      - name: Set up the test environment on Windows
        if: ${{ runner.os == 'Windows' }}
        shell: bash
        # without a console Qt Test only logs to OutputDebugString on Windows
        run: echo "QT_FORCE_STDERR_LOGGING=1" >> $GITHUB_ENV

      - name: Configure probe and client with UI
        id: configure-full
        if: ${{ !cancelled() && matrix.os.full_build }}
        run: >
          cmake -S . -G Ninja --preset ci-dev-client-and-ui
          -DGAMMARAY_WITH_KDSME=ON
          -DGAMMARAY_BUILD_DOCS=${{ runner.os == 'Linux' }}

      - name: Build probe and client with UI
        id: build-full
        if: ${{ !cancelled() && steps.configure-full.outcome == 'success' }}
        run: cmake --build ./build-ci-dev-client-and-ui

      - name: Test probe and client with UI
        if: ${{ !cancelled() && steps.build-full.outcome == 'success' }}
        run: >
          ctest --test-dir ./build-ci-dev-client-and-ui -C Debug --output-on-failure
          --exclude-regex "${{ matrix.os.test_exclude }}"

      - name: Configure client only
        id: configure-client
        if: ${{ !cancelled() }}
        run: >
          cmake -S . -G Ninja --preset ci-dev-client-only
          -DGAMMARAY_WITH_KDSME=ON
          -DGAMMARAY_BUILD_DOCS=OFF

      - name: Build client only
        id: build-client
        if: ${{ !cancelled() && steps.configure-client.outcome == 'success' }}
        run: cmake --build ./build-ci-dev-client-only

      - name: Test client only
        if: ${{ !cancelled() && steps.build-client.outcome == 'success' }}
        run: >
          ctest --test-dir ./build-ci-dev-client-only -C Debug --output-on-failure
          --exclude-regex "${{ matrix.os.test_exclude }}"

      - name: Configure probe only
        id: configure-probe
        if: ${{ !cancelled() }}
        run: cmake -S . -G Ninja --preset ci-dev-probe-only

      - name: Build probe only
        if: ${{ !cancelled() && steps.configure-probe.outcome == 'success' }}
        run: cmake --build ./build-ci-dev-probe-only

      - name: Print the test logs
        if: ${{ failure() }}
        shell: bash
        run: |
          shopt -s nullglob
          for log in build-*/Testing/Temporary/LastTest*.log; do
            echo "::group::$log"
            cat "$log"
            echo "::endgroup::"
          done
