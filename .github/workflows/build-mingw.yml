# Workflow for MinGW
#
# Do not merge with build-qt6.yml, the matrix is sufficiently different and half the steps as well.

name: CI Qt6 MinGW

on:
    push:
        branches:
            - master
    pull_request:
        branches:
            - master

    workflow_dispatch:
        inputs:
            debug_enabled:
                type: boolean
                description: "Enable ssh for debugging purposes"
                required: false
                default: false

jobs:
    # Each job builds all the build configurations one after the other, see build-qt6.yml
    build:
        name: ${{ matrix.toolchain.name }}, Qt ${{ matrix.qt_version }}
        runs-on: windows-latest
        strategy:
            fail-fast: false
            matrix:
                qt_version:
                    - "6.9.3" # Minimum supported/tested on MinGW
                    - "6.10.1" # Bump to latest freely
                toolchain:
                    - name: LLVM MinGW
                      arch: win64_llvm_mingw
                      tools_arg: tools_llvm_mingw1706 tools_ninja
                      mingw_path_segment: llvm-mingw1706_64
                      test_exclude_regex: "^(quicktexturetest|launchertest|clientconnectiontest)$"

                    - name: MinGW
                      arch: win64_mingw
                      tools_arg: tools_mingw1310 tools_ninja
                      mingw_path_segment: mingw1310_64
                      test_exclude_regex: "^(quicktexturetest|launchertest|clientconnectiontest)$"

        steps:
            - name: Setup tmate session
              if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
              uses: mxschmitt/action-tmate@v3
              with:
                  detached: true

            - name: Install Qt with options and default aqtversion
              uses: jurplel/install-qt-action@v4
              with:
                  aqtversion: null # use whatever the default is
                  modules: qtshadertools qtscxml
                  arch: ${{ matrix.toolchain.arch }}
                  tools: ${{ matrix.toolchain.tools_arg }}
                  version: ${{ matrix.qt_version }}
                  cache: true

            # without KDStateMachineEditor, there are no submodules to check out
            - name: Checkout sources
              uses: actions/checkout@v7

            - name: Add MinGW to PATH
              run: |
                  echo "${Qt6_DIR}/../../../Tools/${{ matrix.toolchain.mingw_path_segment }}/bin" >> $GITHUB_PATH
                  echo "${Qt6_DIR}/../../../Tools/Ninja/bin" >> $GITHUB_PATH

            - name: Install ninja-build tool (must be after Qt due PATH changes)
              uses: turtlesec-no/get-ninja@main

            # without a console Qt Test only logs to OutputDebugString on Windows
            - name: Set up the test environment
              shell: bash
              run: echo "QT_FORCE_STDERR_LOGGING=1" >> $GITHUB_ENV

            - name: Configure probe and client with UI
              id: configure-full
              run: >
                  cmake -S . -G Ninja --preset ci-dev-client-and-ui
                  -DWARNINGS_ARE_ERRORS=OFF
                  -DCMAKE_BUILD_TYPE=Release
                  -DGAMMARAY_WITH_KDSME=OFF
                  -DGAMMARAY_BUILD_DOCS=OFF

            - name: Build probe and client with UI
              id: build-full
              if: ${{ !cancelled() && steps.configure-full.outcome == 'success' }}
              run: cmake --build ./build-ci-dev-client-and-ui

            - name: Test probe and client with UI
              if: ${{ !cancelled() && steps.build-full.outcome == 'success' }}
              run: >
                  ctest --test-dir ./build-ci-dev-client-and-ui --output-on-failure
                  --exclude-regex "${{ matrix.toolchain.test_exclude_regex }}"

            - name: Configure client only
              id: configure-client
              if: ${{ !cancelled() }}
              run: >
                  cmake -S . -G Ninja --preset ci-dev-client-only
                  -DWARNINGS_ARE_ERRORS=OFF
                  -DCMAKE_BUILD_TYPE=Release
                  -DGAMMARAY_WITH_KDSME=OFF
                  -DGAMMARAY_BUILD_DOCS=OFF

            - name: Build client only
              id: build-client
              if: ${{ !cancelled() && steps.configure-client.outcome == 'success' }}
              run: cmake --build ./build-ci-dev-client-only

            - name: Test client only
              if: ${{ !cancelled() && steps.build-client.outcome == 'success' }}
              run: >
                  ctest --test-dir ./build-ci-dev-client-only --output-on-failure
                  --exclude-regex "${{ matrix.toolchain.test_exclude_regex }}"

            - name: Configure probe only
              id: configure-probe
              if: ${{ !cancelled() }}
              run: >
                  cmake -S . -G Ninja --preset ci-dev-probe-only
                  -DWARNINGS_ARE_ERRORS=OFF
                  -DCMAKE_BUILD_TYPE=Release

            - name: Build probe only
              if: ${{ !cancelled() && steps.configure-probe.outcome == 'success' }}
              run: cmake --build ./build-ci-dev-probe-only

            - name: Print the test logs
              if: ${{ failure() }}
              shell: bash
              run: |
                  shopt -s nullglob
                  for log in build-*/Testing/Temporary/LastTest*.log; do
                      echo "::group::$log"
                      cat "$log"
                      echo "::endgroup::"
                  done
